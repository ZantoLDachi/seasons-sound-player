<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时间助眠音响 - 四季之声</title>
    <style>
        /* 基础样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }

        body {
            background: #1a1a2e; /* 深色背景利于专注和放松 */
            color: #e6e6e6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            width: 100%;
            text-align: center;
        }

        /* 标题样式 */
        .title {
            margin-bottom: 40px;
        }

        .title h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #ffffff;
            font-weight: 300;
        }

        .title p {
            font-size: 1.1rem;
            color: #b3b3b3;
        }

        /* 四季模块网格布局 */
        .seasons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        /* 季节模块通用样式 */
        .season-card {
            border-radius: 16px;
            padding: 30px 20px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            /* 玻璃拟态效果 */
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        /* 交互反馈：悬停和激活状态 */
        .season-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .season-card.active {
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
        }

        /* 四季特定的渐变色 */
        .season-spring { background: linear-gradient(135deg, #a8e6cf 0%, #56ab91 100%); }
        .season-summer { background: linear-gradient(135deg, #ffafbd 0%, #ffc3a0 100%); }
        .season-autumn { background: linear-gradient(135deg, #f6d365 0%, #fda085 100%); }
        .season-winter { background: linear-gradient(135deg, #e6e9f0 0%, #eef1f5 100%); }

        /* 确保在深色背景上文字可读 */
        .season-spring { color: #1a3c34; }
        .season-summer { color: #5c2c2c; }
        .season-autumn { color: #5c3c1a; }
        .season-winter { color: #2c3e50; }

        .season-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .season-name {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .season-desc {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        /* 时间显示区域 */
        .time-display {
            font-size: 4rem;
            font-weight: 200;
            letter-spacing: 2px;
            margin: 30px 0;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        /* 音频元素隐藏但功能正常 */
        audio {
            display: none;
        }

        /* 响应式调整 */
        @media (max-width: 768px) {
            .seasons-grid {
                grid-template-columns: 1fr;
                max-width: 400px;
                margin-left: auto;
                margin-right: auto;
            }

            .time-display {
                font-size: 3rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="title">
            <h1>时间助眠音响</h1>
            <p>选择一种季节的声音，让时间在自然韵律中流淌</p>
        </header>

        <div class="seasons-grid">
            <!-- 春季模块 -->
            <div class="season-card season-spring" onclick="switchSeason('spring')">
                <div class="season-icon">🌱</div>
                <div class="season-name">春 · 新生</div>
                <div class="season-desc">森林鸟鸣</div>
            </div>

            <!-- 夏季模块 -->
            <div class="season-card season-summer" onclick="switchSeason('summer')">
                <div class="season-icon">🌞</div>
                <div class="season-name">夏 · 繁盛</div>
                <div class="season-desc">阳光海滩</div>
            </div>

            <!-- 秋季模块 -->
            <div class="season-card season-autumn" onclick="switchSeason('autumn')">
                <div class="season-icon">🍂</div>
                <div class="season-name">秋 · 静美</div>
                <div class="season-desc">秋日小屋</div>
            </div>

            <!-- 冬季模块 -->
            <div class="season-card season-winter" onclick="switchSeason('winter')">
                <div class="season-icon">❄️</div>
                <div class="season-name">冬 · 安宁</div>
                <div class="season-desc">雪夜壁炉</div>
            </div>
        </div>

        <!-- 时间显示 -->
        <div class="time-display" id="currentTime">--:--:--</div>

        <!-- 音频元素 -->
        <audio id="springAudio" loop><source src="audio\冥想猫Musecat - 森林物语.mp3"></audio>
        <audio id="summerAudio" loop><source src="audio\冥想猫Musecat - 阳光海滩【白噪音】.mp3" type="audio/mpeg"></audio>
        <audio id="autumnAudio" loop><source src="audio\催眠大师_TUJT - 【白噪音】秋日雨天乡村小屋窗边氛围音｜雨声｜蜡烛燃烧声｜翻页声.mp3" type="audio/mpeg"></audio>
        <audio id="winterAudio" loop><source src="audio\催眠大师_TUJT - 【白噪音】雪夜温馨的客厅氛围音｜风雪声｜壁炉声.mp3" type="audio/mpeg"></audio>
    </div>

    <script>
        // 实时更新时间显示
        function updateTime() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('zh-CN');
            document.getElementById('currentTime').textContent = timeString;
        }

        // 初始化时间显示并每秒更新
        updateTime();
        setInterval(updateTime, 1000);

        // 季节切换逻辑
        let currentSeason = null;
        const audioElements = {
            spring: document.getElementById('springAudio'),
            summer: document.getElementById('summerAudio'),
            autumn: document.getElementById('autumnAudio'),
            winter: document.getElementById('winterAudio')
        };

        function switchSeason(season) {
            // 如果点击的是当前已激活的季节，则停止播放
            if (currentSeason === season) {
                audioElements[season].pause();
                audioElements[season].currentTime = 0;
                document.querySelector(`.season-${season}`).classList.remove('active');
                currentSeason = null;
                return;
            }

            // 停止所有其他音频
            Object.keys(audioElements).forEach(key => {
                if (key !== season) {
                    audioElements[key].pause();
                    audioElements[key].currentTime = 0;
                    document.querySelector(`.season-${key}`).classList.remove('active');
                }
            });

            // 播放选中的季节音频并激活样式
            audioElements[season].play();
            document.querySelector(`.season-${season}`).classList.add('active');
            currentSeason = season;
        }

        // 添加键盘快捷键支持（可选功能）
        document.addEventListener('keydown', (event) => {
            const keyMap = { '1': 'spring', '2': 'summer', '3': 'autumn', '4': 'winter' };
            if (keyMap[event.key]) {
                switchSeason(keyMap[event.key]);
            }
        });
    </script>
</body>
</html>
